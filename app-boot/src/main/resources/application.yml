# Common config shared by every environment.
# Rule of thumb: if a key would be identical in dev/uat/prod, it belongs here —
# not copy-pasted into every profile file.

spring:
  application:
    name: enterprise-app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema changes ONLY via Flyway migrations, never Hibernate auto-DDL
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful        # let in-flight requests finish during rolling deploys
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true       # exposes /actuator/health/liveness and /readiness for k8s probes
      show-details: when-authorized
  info:
    git:
      mode: full            # surfaces commit hash/branch/build-time via /actuator/info
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  ratelimiter:
    instances:
      default:
        limitForPeriod: 50
        limitRefreshPeriodInSeconds: 1
        timeoutInMillis: 0

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
