# PROD — deploys from `main` only, triggered by a git tag (vX.Y.Z), never from a branch build.
# Every value that differs from dev/uat comes from env vars / secret manager — nothing
# environment-specific is hardcoded in this file.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    co.tz.werelay: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoint:
    health:
      show-details: never    # never expose internal details publicly in prod
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus   # no /env, /beans, /heapdump etc. in prod
