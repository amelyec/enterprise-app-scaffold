# UAT — deploys from `release/*` branches. Should mirror PROD topology as closely as
# possible; the whole point of UAT is catching what DEV can't.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}      # supplied via env var / secret manager — never committed
  jpa:
    show-sql: false

logging:
  level:
    co.tz.werelay: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoint:
    health:
      show-details: when-authorized
